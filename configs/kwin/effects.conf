# Efectos nativos de Plasma 6.3.6. Velocidad global en kdeglobals: 0.75.
[Plugins]
blurEnabled=true
scaleEnabled=true
slidingpopupsEnabled=true
slideEnabled=true
maximizeEnabled=true
fadingpopupsEnabled=true
magiclampEnabled=true
wobblywindowsEnabled=true
squashEnabled=false
glideEnabled=false
fadeEnabled=false

[Effect-magiclamp]
AnimationDuration=400

[Effect-wobblywindows]
WobblynessLevel=0
MoveWobble=true
ResizeWobble=false
